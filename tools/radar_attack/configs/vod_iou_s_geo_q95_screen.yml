version: 1
name: vod_iou_s_geo_q95_screen

# Full-scene IoU-S remains unchanged.  The added loss is evaluated only on
# clean Car-GT-associated, current-sweep points covered by the 0--50 m Stage 2
# gate=1 m MNN reference.  Ten uniformly sampled frames are used to establish
# the actual loss scales before choosing a larger campaign.
common:
  cfg_file: cfgs/kitti_models/pointpillar_radar.yaml
  ckpt: checkpoint_epoch_80.pth
  batch_size: 1
  workers: 4
  seed: 1024
  attack_domain: point
  attack_type: iou_s_original
  attack_feature: xyz
  attack_space: feature
  voxel_mode: revoxelize
  point_scope: scene
  point_target_selection: all_gt
  target_classes: [Car, Pedestrian, Cyclist]
  object_iou_thresholds: [Car=0.5, Pedestrian=0.25, Cyclist=0.25]
  measurement_q95_reference: tools/radar_attack/references/vod_stage2_gate1_point_range_q95.json
  iou_s_geo_reference: tools/radar_attack/references/vod_stage2_gate1_point_range_q95.json
  iou_s_original_steps: 500
  iou_s_original_lr: 0.01
  iou_s_original_init_noise: 0.01
  # Disable both bidirectional Chamfer and global XYZ L2. The campaign tests
  # only the IoU-S detection objective plus the Radar Q95 geometry penalty.
  iou_s_original_distance_weight: 0.0
  iou_s_original_log_epsilon: 0.00000001
  iou_s_original_chamfer_chunk_size: 1024
  iou_s_original_return_policy: last
  num_samples: 10
  sample_strategy: uniform
  no_vod_eval: true

experiments:
  - name: lambda_0
    iou_s_geo_weight: 0.0
  - name: lambda_0_01
    iou_s_geo_weight: 0.01
  - name: lambda_0_1
    iou_s_geo_weight: 0.1
  - name: lambda_1
    iou_s_geo_weight: 1.0
