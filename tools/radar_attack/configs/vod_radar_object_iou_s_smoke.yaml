version: 1
name: vod_radar_object_iou_s_smoke

# Engineering smoke test for the Radar-adapted object IoU-S loss. This is a
# single-method validation, not a comparison campaign. Measurement budgets are
# research/digital bounds and are not claimed as physical sensor uncertainty.
common:
  cfg_file: cfgs/kitti_models/pointpillar_radar.yaml
  ckpt: checkpoint_epoch_80.pth
  batch_size: 1
  workers: 4
  seed: 1024
  attack_domain: point
  attack_space: radar_measurement
  temporal_mode: none
  attack_type: pgd
  attack_feature: xyz
  pgd_steps: 10
  voxel_mode: revoxelize
  point_scope: gt_boxes
  target_classes: [Car, Pedestrian, Cyclist]
  point_target_selection: clean_detected
  attack_loss: object_iou_s
  object_iou_thresholds: [Car=0.5, Pedestrian=0.25, Cyclist=0.25]
  iou_s_candidate_topk: 32
  iou_s_score_weight: 1.0
  iou_s_iou_weight: 1.0
  iou_s_log_epsilon: 0.000001
  num_samples: 10
  sample_strategy: uniform
  no_vod_eval: true

experiments:
  - name: measurement_object_iou_s_r05_a1_e1
    epsilon_range: 0.5
    epsilon_azimuth_deg: 1.0
    epsilon_elevation_deg: 1.0
    step_size_range: 0.1
    step_size_azimuth_deg: 0.2
    step_size_elevation_deg: 0.2
