version: 1
name: vod_measurement_geometry_screen

# A five-way mechanism screen on the established uniform 100-frame subset.
# Measurement epsilons are research/digital budgets, not validated physical
# sensor uncertainty. All attacks use the evaluator's clean-detected Car GTs,
# current-sweep points retained by clean hard voxelization, training loss,
# deterministic initialization, and per-step real hard revoxelization.
common:
  cfg_file: cfgs/kitti_models/pointpillar_radar.yaml
  ckpt: checkpoint_epoch_80.pth
  batch_size: 1
  workers: 4
  seed: 1024
  attack_domain: point
  attack_type: pgd
  attack_feature: xyz
  pgd_steps: 10
  voxel_mode: revoxelize
  point_scope: gt_boxes
  target_classes: [Car]
  point_target_selection: clean_detected
  current_sweep_only: true
  attack_loss: training
  object_loss_iou_threshold: 0.5
  object_iou_thresholds: [Car=0.5]
  num_samples: 100
  sample_strategy: uniform
  no_vod_eval: true

experiments:
  # Auxiliary displacement-matched point for the three single-variable
  # measurement attacks. It is not an additional threat-model sweep.
  - name: xyz_current_e0025_aux
    attack_space: feature
    epsilon_xyz: 0.025
    step_size: 0.005

  - name: xyz_current_e005
    attack_space: feature
    epsilon_xyz: 0.05
    step_size: 0.01

  - name: range_only_r005
    attack_space: radar_measurement
    epsilon_range: 0.05
    epsilon_azimuth_deg: 0.0
    epsilon_elevation_deg: 0.0
    step_size_range: 0.01

  - name: azimuth_only_a01
    attack_space: radar_measurement
    epsilon_range: 0.0
    epsilon_azimuth_deg: 0.1
    epsilon_elevation_deg: 0.0
    step_size_azimuth_deg: 0.02

  - name: elevation_only_e01
    attack_space: radar_measurement
    epsilon_range: 0.0
    epsilon_azimuth_deg: 0.0
    epsilon_elevation_deg: 0.1
    step_size_elevation_deg: 0.02

  - name: measurement_all_r005_a01_e01
    attack_space: radar_measurement
    epsilon_range: 0.05
    epsilon_azimuth_deg: 0.1
    epsilon_elevation_deg: 0.1
    step_size_range: 0.01
    step_size_azimuth_deg: 0.02
    step_size_elevation_deg: 0.02
