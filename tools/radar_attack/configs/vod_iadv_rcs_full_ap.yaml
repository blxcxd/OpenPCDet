version: 1
name: vod_iadv_rcs_full_ap

# Formal full-validation comparison selected after the 100-frame screen:
# epsilon_rcs=1.6 is about 10% of VoD RCS IQR and produced non-zero Object ASR.
common:
  cfg_file: cfgs/kitti_models/pointpillar_radar.yaml
  ckpt: output/kitti_models/pointpillar_radar/vod5_retrain_seed0/ckpt/checkpoint_epoch_80.pth
  batch_size: 1
  workers: 4
  seed: 1024
  attack_domain: point
  attack_feature: rcs
  voxel_mode: fixed
  point_scope: gt_boxes
  target_classes: [Car]
  pgd_steps: 10
  iadv_steps: 10
  iadv_scope: gt_boxes
  iadv_neighbor_scope: object
  iadv_attack_voxel_size: 0.1
  iadv_mu: 1.0
  iadv_lambda: 1000.0
  iadv_d_max: 75.0
  iadv_k_neighbors: 16
  iadv_min_neighbors: 3
  iadv_gradient_norm: l1
  object_iou_thresholds: [Car=0.5]
  sample_strategy: first
  vod_eval: true
  vod_devkit: ~/VoD-evaluation

experiments:
  - name: pgd_object_e16_full_ap
    attack_type: pgd
    epsilon_rcs: 1.6
    step_size: 0.32
    random_start: true

  - name: iadv_object_v01_e16_full_ap
    attack_type: iadv
    epsilon_rcs: 1.6
    step_size: 0.32
