version: 1
name: vod_iou_s_original_last_naturalness

# Replays the prior 100-frame final-Adam-iterate IoU-S run. The old run used
# save_adv=false, so the step-500 point clouds were not retained and the new
# pointwise naturalness metric cannot be reconstructed from its JSON alone.
# This run keeps the original Recall/object/endpoint evaluation, adds the
# Stage 2 gate=1 m Q95 metric, and saves the regenerated final point clouds.
common:
  cfg_file: cfgs/kitti_models/pointpillar_radar.yaml
  ckpt: checkpoint_epoch_80.pth
  batch_size: 1
  workers: 4
  seed: 1024
  attack_domain: point
  attack_type: iou_s_original
  attack_feature: xyz
  attack_space: feature
  voxel_mode: revoxelize
  point_scope: scene
  point_target_selection: all_gt
  target_classes: [Car, Pedestrian, Cyclist]
  object_iou_thresholds: [Car=0.5, Pedestrian=0.25, Cyclist=0.25]
  iou_s_original_steps: 500
  iou_s_original_lr: 0.01
  iou_s_original_init_noise: 0.01
  iou_s_original_distance_weight: 1.0
  iou_s_original_log_epsilon: 0.00000001
  iou_s_original_chamfer_chunk_size: 1024
  iou_s_original_return_policy: last
  num_samples: 100
  sample_strategy: uniform
  save_adv: true
  adv_format: npy
  no_vod_eval: true

experiments:
  - name: iou_s_step500_full_metrics
